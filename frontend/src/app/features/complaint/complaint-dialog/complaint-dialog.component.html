<h2 mat-dialog-title>New complaint</h2>
<mat-dialog-content>
  <form class="dlg-form" [formGroup]="form">
    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-label>Title</mat-label>
      <input matInput formControlName="title" />
    </mat-form-field>
    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-label>Details</mat-label>
      <textarea matInput rows="3" formControlName="description"></textarea>
    </mat-form-field>
    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-label>Priority</mat-label>
      <mat-select formControlName="priority">
        <mat-option value="low">low (7d)</mat-option>
        <mat-option value="medium">medium (72h)</mat-option>
        <mat-option value="high">high (24h)</mat-option>
      </mat-select>
    </mat-form-field>
    <label class="file">
      <span>Photo (optional)</span>
      <input type="file" accept="image/*" (change)="onFile($event)" />
    </label>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" [mat-dialog-close]="null">Cancel</button>
  <button
    mat-flat-button
    color="primary"
    type="button"
    [disabled]="form.invalid"
    (click)="submit()"
  >
    Submit
  </button>
</mat-dialog-actions>
