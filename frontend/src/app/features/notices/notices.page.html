<section class="page-frame">
  <div class="page-actionbar">
    <div class="page-actionbar__title">
      <h1>Notices</h1>
      <p>Hostel announcements</p>
    </div>
    <div class="page-actionbar__actions">
      @if (staff()) {
        <button mat-flat-button color="primary" type="button" (click)="openCreate()">
          <mat-icon>add</mat-icon>
          Post notice
        </button>
      }
    </div>
  </div>

  <div class="page-body">
    <app-h4-table
      [rows]="notices()"
      [columns]="columns"
      [actions]="actions()"
      [loading]="loading()"
      emptyIcon="campaign"
      emptyText="No notices yet"
      searchPlaceholder="Search notices"
      [searchFields]="['title', 'body', 'created_by_name']"
      (actionClick)="onAction($event)"
    />
  </div>
</section>
