<h2 mat-dialog-title>Request room change</h2>
<mat-dialog-content>
  <form class="dlg-form" [formGroup]="form">
    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-label>Reason</mat-label>
      <textarea matInput rows="3" formControlName="reason"></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" [mat-dialog-close]="null">Cancel</button>
  <button mat-flat-button color="primary" type="button" [disabled]="form.invalid" (click)="submit()">
    Submit
  </button>
</mat-dialog-actions>
