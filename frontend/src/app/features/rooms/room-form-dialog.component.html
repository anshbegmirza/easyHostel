<h2 mat-dialog-title>Add room</h2>
<mat-dialog-content>
  <form class="dlg-form" [formGroup]="form">
    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-label>Code</mat-label>
      <input matInput formControlName="code" placeholder="A101" />
    </mat-form-field>
    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-label>Capacity</mat-label>
      <input matInput type="number" min="1" formControlName="capacity" />
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" mat-dialog-close>Cancel</button>
  <button mat-flat-button color="primary" type="button" [disabled]="form.invalid" [mat-dialog-close]="form.getRawValue()">
    Save
  </button>
</mat-dialog-actions>
