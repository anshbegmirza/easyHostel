<h2 mat-dialog-title>Set status · {{ data.room.code }}</h2>
<mat-dialog-content>
  <form class="dlg-form" [formGroup]="form">
    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="full">
      <mat-label>Status</mat-label>
      <mat-select formControlName="status">
        <mat-option value="available">available</mat-option>
        <mat-option value="occupied">occupied</mat-option>
        <mat-option value="maintenance">maintenance</mat-option>
      </mat-select>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" [mat-dialog-close]="null">Cancel</button>
  <button mat-flat-button color="primary" type="button" (click)="submit()">
    Save
  </button>
</mat-dialog-actions>
